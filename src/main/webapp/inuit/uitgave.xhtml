<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<f:metadata>
    <f:event type="preRenderView" listener="#{outputBean.fetch()}"/>
</f:metadata>

<ui:composition template="/WEB-INF/templates/skeleton.xhtml">

    <ui:define name="title">Uitgave</ui:define>

    <ui:define name="breadcrumb">
        <p:menuitem value="Home" outcome="/index"/>
        <p:menuitem value="In/Uit"/>
        <p:menuitem value="Uitgave"/>
    </ui:define>

    <ui:define name="content">
        <h1>Uitgave</h1>
        <hr/>

        <p:panel header="1. Kies een klant">
            <div class="grid ui-fluid">
                <div class="col-12 md:col-4">
                    <p:outputLabel for="voornaam" value="Voornaam" styleClass="block mb-2"/>
                    <p:inputText id="voornaam" value="#{outputBean.voornaam}" styleClass="w-full"/>
                </div>
                <div class="col-12 md:col-4">
                    <p:outputLabel for="achternaam" value="Achternaam" styleClass="block mb-2"/>
                    <p:inputText id="achternaam" value="#{outputBean.achternaam}" styleClass="w-full"/>
                </div>
                <div class="col-12 md:col-4">
                    <div class="flex gap-2 mt-2 md:mt-4">
                        <p:commandButton value="Zoeken"
                                         icon="pi pi-search"
                                         action="#{outputBean.zoek}"
                                         update="@form"
                                         styleClass="ui-button-raised"/>
                    </div>
                </div>
            </div>

            <p:dataTable id="resultaten"
                         value="#{outputBean.resultaten}"
                         var="klant"
                         rows="5"
                         paginator="true"
                         emptyMessage="Geen klanten gevonden"
                         rendered="#{not empty outputBean.resultaten}">
                <p:column headerText="#">#{klant.id}</p:column>
                <p:column headerText="Voornaam">#{klant.firstName}</p:column>
                <p:column headerText="Tussenvoegsels">#{klant.infix}</p:column>
                <p:column headerText="Achternaam">#{klant.lastName}</p:column>
                <p:column headerText="Woonplaats">#{klant.city}</p:column>
                <p:column styleClass="w-1">
                    <p:commandButton icon="pi pi-arrow-right"
                                     title="Deze klant kiezen"
                                     action="#{outputBean.selecteer(klant)}"
                                     update="@form"
                                     styleClass="ui-button-raised"/>
                </p:column>
            </p:dataTable>

            <p:panelGrid columns="2" columnClasses="label, value"
                         rendered="#{outputBean.person ne null}">
                <p:outputLabel value="Gekozen klant"/>
                <p:link outcome="/dataset/person/crud" value="#{outputBean.person.fullname}">
                    <f:param name="id" value="#{outputBean.person.id}"/>
                </p:link>
            </p:panelGrid>
        </p:panel>

        <p:panel header="2. Kies het apparaat">
            <p:dataTable id="stock"
                         value="#{outputBean.stock}"
                         var="apparaat"
                         rows="10"
                         paginator="true"
                         emptyMessage="Geen apparatuur geschikt voor uitgave"
                         paginatorPosition="bottom">

                <p:column headerText="#">
                    <h:outputText value="#{apparaat.id}"/>
                </p:column>
                <p:column headerText="Categorie">
                    <h:outputText value="#{apparaat.categoryName}"/>
                </p:column>
                <p:column headerText="Fabrikant">
                    <h:outputText value="#{apparaat.manufacturer}"/>
                </p:column>
                <p:column headerText="Model">
                    <h:outputText value="#{apparaat.model}"/>
                </p:column>
                <p:column headerText="Serienummer">
                    <h:outputText value="#{apparaat.serialNumber}"/>
                </p:column>
                <p:column styleClass="w-1">
                    <p:commandButton icon="pi pi-arrow-right"
                                     title="Dit apparaat kiezen"
                                     action="#{outputBean.selecteerEquipment(apparaat)}"
                                     update="@form"
                                     styleClass="ui-button-raised"/>
                </p:column>
            </p:dataTable>

            <p:panelGrid columns="2" columnClasses="label, value"
                         rendered="#{outputBean.equipment ne null}">
                <p:outputLabel value="Gekozen apparaat"/>
                <h:outputText
                        value="#{outputBean.equipment.id} - #{outputBean.equipment.categoryName} #{outputBean.equipment.manufacturer} #{outputBean.equipment.model}"/>
            </p:panelGrid>
        </p:panel>

        <div class="flex justify-content-end gap-2 mt-4">
            <p:commandButton value="Uitgeven"
                             icon="pi pi-check"
                             action="#{outputBean.uitgeven}"
                             update="@form"
                             styleClass="ui-button-raised ui-button-success"/>
        </div>
    </ui:define>

</ui:composition>
</html>
