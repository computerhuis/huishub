<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<f:metadata>
    <f:viewParam name="id" value="#{activityCrudBean.id}"/>
    <f:event type="preRenderView" listener="#{activityCrudBean.fetch()}"/>
</f:metadata>

<ui:composition template="/WEB-INF/templates/skeleton.xhtml">

    <ui:define name="title">Educatie</ui:define>

    <ui:define name="breadcrumb">
        <p:menuitem value="Home" outcome="/index"/>
        <p:menuitem value="Educatie" outcome="/educatie"/>
        <p:menuitem value="#{activityCrudBean.id != null ? activityCrudBean.id : 'Nieuw'}"/>
    </ui:define>

    <ui:define name="content">
        <h1>Activiteit</h1>
        <hr/>
        <div class="grid ui-fluid">
            <p:outputLabel for="id" value="Identificatie nummer:" styleClass="col-12 mb-2 md:col-2 md:mb-0"/>
            <div class="col-12 md:col-10">
                <p:inputText id="id" disabled="true" value="#{activityCrudBean.activity.id}"/>
            </div>
        </div>
        <div class="grid ui-fluid">
            <p:outputLabel for="name" value="Naam:" styleClass="col-12 mb-2 md:col-2 md:mb-0"/>
            <div class="col-12 md:col-10">
                <p:inputText id="name" value="#{activityCrudBean.activity.name}" required="true"/>
            </div>
        </div>
        <div class="grid ui-fluid">
            <p:outputLabel for="reporting" value="Rapportage:" styleClass="col-12 mb-2 md:col-2 md:mb-0"/>
            <div class="col-12 md:col-10">
                <p:selectBooleanCheckbox id="reporting" value="#{activityCrudBean.activity.reporting}"/>
            </div>
        </div>
        <div class="grid ui-fluid">
            <p:outputLabel for="registered" value="Vanaf:" styleClass="col-12 mb-2 md:col-2 md:mb-0"/>
            <div class="col-12 md:col-10">
                <p:datePicker id="registered"
                              value="#{activityCrudBean.activity.registered}"
                              showTime="true"
                              showIcon="true"
                              showOnFocus="false"/>
            </div>
        </div>
        <div class="grid ui-fluid">
            <p:outputLabel for="unregistered" value="Tot:" styleClass="col-12 mb-2 md:col-2 md:mb-0"/>
            <div class="col-12 md:col-10">
                <p:datePicker id="unregistered"
                              value="#{activityCrudBean.activity.unregistered}"
                              showTime="true"
                              showIcon="true"
                              showOnFocus="false"/>
            </div>
        </div>

        <div class="grid ui-fluid mt-5">
            <div class="col-1">
            </div>
            <div class="col-2">
                <p:linkButton outcome="/educatie" value="Annuleren"
                              icon="pi pi-times"
                              styleClass="ui-button-raised ui-button-outlined"/>
            </div>
            <div class="col-5">
            </div>
            <div class="col-2">
                <p:commandButton type="submit" styleClass="ui-button-raised " value="Opslaan"
                                 action="#{activityCrudBean.save}" update=":content:growl"/>
            </div>
        </div>
    </ui:define>

</ui:composition>
</html>
