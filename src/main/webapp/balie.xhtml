<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:my="http://xmlns.jcp.org/jsf/composite/components">

<ui:composition template="/WEB-INF/templates/skeleton.xhtml">

    <ui:define name="title">Balie</ui:define>

    <ui:define name="breadcrumb">
        <p:menuitem value="Home" outcome="/index"/>
        <p:menuitem value="Balie"/>
    </ui:define>

    <ui:define name="content">
        <div class="grid ui-fluid mb-2">
            <div class="col-12 md:col-9">
                <h1>Balie</h1>
                Zoek een klant en bekijk de gegevens, apparatuur en tickets
            </div>
            <div class="col-12 md:col-3 flex align-items-end justify-content-end gap-2">
                <p:linkButton outcome="/inuit/uitgave" icon="pi pi-arrow-left" value="Uitgave"
                              styleClass="ui-button-raised ui-button-outlined"/>
                <p:linkButton outcome="/werkplaats/new" icon="pi pi-plus" value="Nieuwe intake"
                              styleClass="ui-button-raised"/>
            </div>
        </div>
        <hr/>

        <my:stepper steps="#{balieBean.steps}" currentStep="#{balieBean.currentStep}"/>

        <!-- Stap 1: Klant zoeken -->
        <ui:fragment rendered="#{balieBean.currentStep eq 1}">
            <p:panel header="Klant zoeken">
                <div class="grid ui-fluid">
                    <div class="col-12 md:col-4">
                        <p:outputLabel for="voornaam" value="Voornaam" styleClass="block mb-2"/>
                        <p:inputText id="voornaam" value="#{balieBean.voornaam}" styleClass="w-full"/>
                    </div>
                    <div class="col-12 md:col-4">
                        <p:outputLabel for="achternaam" value="Achternaam" styleClass="block mb-2"/>
                        <p:inputText id="achternaam" value="#{balieBean.achternaam}" styleClass="w-full"/>
                    </div>
                    <div class="col-12 md:col-4">
                        <div class="flex gap-2 mt-2 md:mt-4">
                            <p:commandButton value="Zoeken"
                                             icon="pi pi-search"
                                             action="#{balieBean.zoek}"
                                             update="@form"
                                             styleClass="ui-button-raised"/>
                        </div>
                    </div>
                </div>

                <p:dataTable id="resultaten"
                             value="#{balieBean.resultaten}"
                             var="klant"
                             rows="5"
                             paginator="true"
                             emptyMessage="Geen klanten gevonden"
                             rendered="#{not empty balieBean.resultaten}">
                    <p:column headerText="#">#{klant.id}</p:column>
                    <p:column headerText="Voornaam">#{klant.firstName}</p:column>
                    <p:column headerText="Tussenvoegsels">#{klant.infix}</p:column>
                    <p:column headerText="Achternaam">#{klant.lastName}</p:column>
                    <p:column headerText="Woonplaats">#{klant.city}</p:column>
                    <p:column headerText="Telefoon">#{klant.telephone}</p:column>
                    <p:column styleClass="w-1">
                        <p:commandButton icon="pi pi-arrow-right"
                                         title="Deze klant kiezen"
                                         action="#{balieBean.selecteer(klant)}"
                                         update="@form"
                                         styleClass="ui-button-raised"/>
                    </p:column>
                </p:dataTable>

                <ui:fragment rendered="#{balieBean.person ne null}">
                    <p:panelGrid columns="2" columnClasses="label, value">
                        <p:outputLabel value="Gekozen klant"/>
                        <h:outputText value="#{balieBean.person.fullname}"/>
                    </p:panelGrid>
                </ui:fragment>
            </p:panel>
        </ui:fragment>

        <!-- Stap 2: Klantgegevens -->
        <ui:fragment rendered="#{balieBean.currentStep eq 2}">
            <p:panel header="Klantgegevens">
                <p:panelGrid columns="2" columnClasses="label, value">
                    <p:outputLabel value="Naam"/>
                    <p:link outcome="/dataset/person/crud" value="#{balieBean.person.fullname}">
                        <f:param name="id" value="#{balieBean.person.id}"/>
                    </p:link>

                    <p:outputLabel value="Telefoon"/>
                    <h:outputText value="#{balieBean.person.telephone}"/>

                    <p:outputLabel value="Mobiel"/>
                    <h:outputText value="#{balieBean.person.mobile}"/>

                    <p:outputLabel value="E-mailadres"/>
                    <h:outputLink value="mailto:#{balieBean.person.email}">
                        <h:outputText value="#{balieBean.person.email}"/>
                    </h:outputLink>

                    <p:outputLabel value="Adres"/>
                    <h:outputText
                            value="#{balieBean.person.street} #{balieBean.person.houseNumber}#{balieBean.person.houseNumberAddition}, #{balieBean.person.postalCode} #{balieBean.person.city}"/>
                </p:panelGrid>
            </p:panel>
        </ui:fragment>

        <!-- Stap 3: Apparatuur -->
        <ui:fragment rendered="#{balieBean.currentStep eq 3}">
            <p:panel header="Apparatuur">
                <p:dataTable id="klantApparatuur"
                             value="#{balieBean.equipment}"
                             var="apparaat"
                             rows="10"
                             emptyMessage="Geen apparatuur bekend"
                             paginator="true"
                             paginatorPosition="bottom">
                    <p:column headerText="#" sortBy="#{apparaat.id}">
                        <p:link outcome="/dataset/equipment/crud" value="#{apparaat.id}">
                            <f:param name="id" value="#{apparaat.id}"/>
                        </p:link>
                    </p:column>
                    <p:column headerText="Categorie">
                        <h:outputText value="#{apparaat.categoryName}"/>
                    </p:column>
                    <p:column headerText="Fabrikant">
                        <h:outputText value="#{apparaat.manufacturer}"/>
                    </p:column>
                    <p:column headerText="Model">
                        <h:outputText value="#{apparaat.model}"/>
                    </p:column>
                    <p:column headerText="Serienummer">
                        <h:outputText value="#{apparaat.serialNumber}"/>
                    </p:column>
                    <p:column headerText="Status">
                        <p:tag rounded="true" value="#{apparaat.statusName}"/>
                    </p:column>
                </p:dataTable>
            </p:panel>
        </ui:fragment>

        <!-- Stap 4: Tickets -->
        <ui:fragment rendered="#{balieBean.currentStep eq 4}">
            <p:panel header="Tickets">
                <p:dataTable id="klantTickets"
                             value="#{balieBean.tickets}"
                             var="ticket"
                             rows="10"
                             emptyMessage="Geen tickets bekend"
                             paginator="true"
                             paginatorPosition="bottom">
                    <p:column headerText="#" sortBy="#{ticket.id}">
                        <p:link outcome="/dataset/ticket/crud" value="#{ticket.id}">
                            <f:param name="id" value="#{ticket.id}"/>
                        </p:link>
                    </p:column>
                    <p:column headerText="Apparaat">
                        <p:link outcome="/dataset/equipment/crud" value="#{ticket.equipmentId}">
                            <f:param name="id" value="#{ticket.equipmentId}"/>
                        </p:link>
                    </p:column>
                    <p:column headerText="Type">
                        <h:outputText value="#{ticket.ticketTypeName}"/>
                    </p:column>
                    <p:column headerText="Inname">
                        <h:outputText value="#{ticket.registered != null ? ticket.registered : ''}">
                            <f:convertDateTime type="localDate"/>
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Status">
                        <p:tag rounded="true"
                               value="#{ticket.statusName}"
                               severity="#{ticket.statusSeverity}"/>
                    </p:column>
                    <p:column headerText="Onderwerp">
                        <h:outputText value="#{ticket.subject}"/>
                    </p:column>
                </p:dataTable>
            </p:panel>
        </ui:fragment>

        <div class="flex justify-content-end gap-2 mt-4">
            <p:commandButton value="Vorige"
                             icon="pi pi-arrow-left"
                             action="#{balieBean.vorige}"
                             update="@form"
                             rendered="#{balieBean.currentStep gt 1}"
                             styleClass="ui-button-raised ui-button-outlined"/>
            <p:commandButton value="Volgende"
                             icon="pi pi-arrow-right"
                             iconPos="right"
                             action="#{balieBean.volgende}"
                             update="@form"
                             rendered="#{balieBean.currentStep lt 4 and (balieBean.currentStep gt 1 or balieBean.person ne null)}"
                             styleClass="ui-button-raised"/>
            <p:commandButton value="Afronden"
                             icon="pi pi-check"
                             action="#{balieBean.afronden}"
                             rendered="#{balieBean.currentStep eq 4}"
                             styleClass="ui-button-raised ui-button-success"/>
        </div>
    </ui:define>

</ui:composition>
</html>
