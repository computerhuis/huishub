<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<f:metadata>
    <f:event type="preRenderView" listener="#{proofOfIssueListBean.fetch()}"/>
</f:metadata>

<ui:composition template="/WEB-INF/templates/skeleton.xhtml">

    <ui:define name="title">Uitgiftbewijzen</ui:define>

    <ui:define name="breadcrumb">
        <p:menuitem value="Home" outcome="/index"/>
        <p:menuitem value="Rapportage"/>
        <p:menuitem value="Uitgiftbewijzen"/>
    </ui:define>

    <ui:define name="content">
        <h1>Uitgiftbewijzen</h1>
        <hr/>

        <div class="grid ui-fluid mt-2 mb-2">
            <p:outputLabel for="query" value="Zoeken:" styleClass="col-12 mb-2 md:col-2 md:mb-0"/>
            <div class="col-12 md:col-10 flex gap-2">
                <p:inputText id="query"
                             value="#{proofOfIssueListBean.query}"
                             placeholder="Uitgiftenummer, ontvanger, uitgever of datum (dd-mm-jjjj)"
                             styleClass="w-full"/>
                <p:commandButton value="Zoeken"
                                 icon="pi pi-search"
                                 action="#{proofOfIssueListBean.fetch}"
                                 update="@form"
                                 styleClass="ui-button-raised"/>
                <p:commandButton value="Wissen"
                                 icon="pi pi-times"
                                 action="#{proofOfIssueListBean.clear}"
                                 update="@form"
                                 styleClass="ui-button-outlined ui-button-raised"/>
            </div>
        </div>

        <p:dataTable
            id="proofOfIssueList"
            var="issue"
            value="#{proofOfIssueListBean.list}"
            rows="10"
            paginator="true"
            paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
            currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords}"
            paginatorPosition="bottom"
            emptyMessage="Geen uitgiftbewijzen gevonden">

            <p:column headerText="Uitgiftenummer" sortBy="#{issue.number}" sortOrder="desc">
                <p:link outcome="/reports/proofofissue/view" value="#{issue.number}">
                    <f:param name="id" value="#{issue.id}"/>
                </p:link>
            </p:column>
            <p:column headerText="Uitgiftedatum">
                <h:outputText value="#{issue.issueDate}">
                    <f:convertDateTime pattern="dd-MM-yyyy" locale="nl"/>
                </h:outputText>
            </p:column>
            <p:column headerText="Ontvanger">
                <h:outputText value="#{issue.recipient}"/>
            </p:column>
            <p:column headerText="Uitgegeven door">
                <h:outputText value="#{issue.issuedBy}"/>
            </p:column>
            <p:column styleClass="w-1">
                <p:linkButton outcome="/reports/proofofissue/view" icon="pi pi-search"
                              title="Uitgiftbewijs bekijken"
                              styleClass="rounded-button ui-button-outlined ui-button-raised">
                    <f:param name="id" value="#{issue.id}"/>
                </p:linkButton>
            </p:column>
        </p:dataTable>
    </ui:define>

</ui:composition>
</html>
